# PR마다 빌드·테스트 (인프라·CI/CD 문서 4절 "PR 올릴 때"). core의 ci.yml과 같은 모양
# + SonarQube Cloud 분석: main에 합칠 때 "새 코드 커버리지 80% 이상" 품질 게이트를 본다
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 PR에 커밋을 연달아 올리면 이전 실행은 취소하고 최신 것만 돌린다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:                     # 브랜치 보호에서 "필수 검사"로 고를 이름
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # Sonar가 "새 코드"를 git 기록으로 가려낸다

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 빌드 + 테스트 + 커버리지
        run: ./mvnw -B verify

      # 학교 SonarQube 서버로 분석. SONAR_TOKEN이 아직 없으면(설정 전·fork PR) 건너뛴다. 빌드·테스트는 그대로 필수
      # Community 판은 브랜치·PR 분석이 없어 한 갈래로만 쌓인다(확인 필요). 그래서
      #  - develop·main에 합쳐질 때: 분석만 (대시보드 갱신)
      #  - main으로 가는 PR: 분석 + 품질 게이트(새 코드 커버리지 80%)를 기다려 실패하면 CI도 실패
      - name: SonarQube 분석
        if: env.SONAR_TOKEN != '' && (github.event_name == 'push' || github.base_ref == 'main')
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GATE_WAIT: ${{ github.base_ref == 'main' }}
        run: >
          ./mvnw -B -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.qualitygate.wait="$GATE_WAIT"
          -Dsonar.qualitygate.timeout=300

      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

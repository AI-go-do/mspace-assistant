# PR마다 빌드·테스트 (인프라·CI/CD 문서 4절 "PR 올릴 때"). core의 ci.yml과 같은 모양
# + 학교 SonarQube(Community 서버) 분석: main에 합칠 때 "새 코드 커버리지 80% 이상" 품질 게이트를 본다
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 PR에 커밋을 연달아 올리면 이전 실행은 취소하고 최신 것만 돌린다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 외부 액션은 태그 대신 커밋 SHA로 고정 (deploy.yml과 같은 이유). 뒤 주석이 원래 버전
jobs:
  build:                     # 브랜치 보호에서 "필수 검사"로 고를 이름
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 코드 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # 토큰을 .git 설정에 남기지 않는다 (뒤에 git push 같은 건 없음)
          fetch-depth: 0     # Sonar가 "새 코드"를 git 기록으로 가려낸다

      - name: JDK 21 설치
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 빌드 + 테스트 + 커버리지
        run: ./mvnw -B verify

      # 학교 SonarQube(Community) 서버. Community 판은 브랜치·PR을 나눠 담지 못하고 프로젝트 하나에 덮어쓴다.
      # 토큰은 Sonar 단계에만 넘긴다. 빌드·테스트 단계(테스트 코드·의존성)가 토큰을 볼 수 없게 (core ci.yml과 같은 모양)

      # 1) develop/main에 합쳐진 뒤: 결과를 기록만 한다 (막지 않음)
      - name: SonarQube 분석
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true    # Sonar 서버·토큰 문제로 develop 검사가 빨개지지 않게
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN이 없어 SonarQube 분석을 건너뜁니다."
            exit 0
          fi
          ./mvnw -B -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL"

      # 2) main으로 가는 PR: 품질 게이트(새 코드 커버리지 80%)를 통과해야 build가 초록.
      #    토큰이 없으면 게이트를 확인할 수 없으니 건너뛰지 않고 실패시킨다
      - name: SonarQube 품질 게이트 (main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN이 없어 main 품질 게이트를 확인할 수 없습니다. 저장소 Secrets를 넣어 주세요."
            exit 1
          fi
          ./mvnw -B -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300

      # 3) 게이트가 실패하면 어떤 조건이 걸렸는지 로그에 바로 찍는다. 학교 SonarQube 대시보드는 학교 밖에서 안 열려서
      #    로그만 보고 고칠 수 있게 한다. 출력은 조건 이름·값·기준, 새 코드 이슈의 규칙·파일·줄·문장뿐 (토큰은 안 찍힘)
      - name: SonarQube 품질 게이트 실패 이유
        if: failure() && github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          [ -z "$SONAR_TOKEN" ] && exit 0
          api() { curl -sS -m 30 -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/$1"; }
          echo "== 품질 게이트 조건 (ERROR가 걸린 조건)"
          api "qualitygates/project_status?projectKey=mspace-assistant" \
            | jq -r '.projectStatus.conditions[] | "\(.status)\t\(.metricKey)\t실제=\(.actualValue // "-")\t기준 \(.comparator) \(.errorThreshold)"'
          echo "== 새 코드 이슈 (최대 100건)"
          api "issues/search?componentKeys=mspace-assistant&inNewCodePeriod=true&resolved=false&ps=100" \
            | jq -r '"총 \(.total)건", (.issues[] | "\(.severity)\t\(.rule)\t\(.component | sub("^mspace-assistant:"; "")):\(.line // "-")\t\(.message)")'
          echo "== 검토 안 된 보안 핫스팟 (새 코드)"
          api "hotspots/search?projectKey=mspace-assistant&inNewCodePeriod=true&status=TO_REVIEW&ps=100" \
            | jq -r '"총 \(.paging.total)건", (.hotspots[] | "\(.vulnerabilityProbability)\t\(.ruleKey)\t\(.component | sub("^mspace-assistant:"; "")):\(.line // "-")\t\(.message)")'
          echo "== 새 코드에서 커버리지가 낮은 파일 (상위 15)"
          api "measures/component_tree?component=mspace-assistant&metricKeys=new_coverage,new_uncovered_lines,new_uncovered_conditions&qualifiers=FIL&ps=500" \
            | jq -r '[.components[] | {p: .path, m: ([.measures[] | {(.metric): (.period.value // .value)}] | add)} | select(.m.new_coverage != null)]
                     | sort_by(.m.new_coverage | tonumber) | .[:15][] | "\(.m.new_coverage)%\t안 덮인 줄 \(.m.new_uncovered_lines // "-")\t조건 \(.m.new_uncovered_conditions // "-")\t\(.p)"'

      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

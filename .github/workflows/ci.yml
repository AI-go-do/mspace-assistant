# PR마다 빌드·테스트 (인프라·CI/CD 문서 4절 "PR 올릴 때"). 이미지 빌드·GHCR·배포는 재웅의 인프라 규칙이 정해지면 붙인다
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 빌드·테스트
        run: ./mvnw -B verify
      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

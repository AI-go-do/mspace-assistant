# develop/main에 합쳐지면 assistant 이미지 2개를 만들어 GHCR(GitHub 이미지 저장소)에 올린다.
#   ghcr.io/ai-go-do/mspace-assistant-mcp    (MCP 서버, 8090)
#   ghcr.io/ai-go-do/mspace-assistant-agent  (에이전트, 8091)
# core의 deploy.yml과 같은 모양. 그다음 server job이 학교 서버에서 mcp·agent를 새 이미지로 바꾼다 (DEPLOY_ENABLED일 때만).
name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:          # Actions 탭에서 손으로도 돌릴 수 있게

# 외부 액션은 태그(v3 등) 대신 커밋 SHA로 고정한다. 태그는 바꿔치기될 수 있어서,
# packages: write 권한을 가진 이 job에서 남의 코드가 바뀌어 실행되는 걸 막는다. 뒤 주석이 원래 버전
jobs:
  image:
    name: image (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write         # GHCR에 이미지를 올릴 권한 (별도 토큰 필요 없음)
    # 같은 브랜치 이미지 빌드가 겹치면 앞의 것은 취소하고 최신 것만.
    # (워크플로 전체가 아니라 이 job에만 걸어서, 서버 교체 중인 server job은 취소되지 않게)
    concurrency:
      group: image-${{ github.ref }}-${{ matrix.module }}
      cancel-in-progress: true

    # 모듈 2개를 동시에 빌드한다. 한쪽이 실패해도 다른 쪽은 끝까지
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: mcp-server
            image: ghcr.io/ai-go-do/mspace-assistant-mcp
          - module: agent
            image: ghcr.io/ai-go-do/mspace-assistant-agent

    steps:
      - name: 코드 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # 토큰을 .git 설정에 남기지 않는다 (뒤에 git push 같은 건 없음)

      - name: GHCR 로그인
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Actions가 자동으로 주는 토큰

      - name: 태그 정하기
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch     # develop 또는 main
            type=sha,prefix=sha-      # sha-ab12cd3 (되돌릴 때 이 태그로)

      - name: Buildx 준비
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: 이미지 빌드 + 올리기
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 모듈마다 캐시를 따로 둬서 서로 덮어쓰지 않게
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  # 학교 서버에 배포: SSH로 들어가 새 이미지를 받고 해당 컨테이너만 다시 띄운다.
  # 서버가 준비되기 전에는 건너뛴다. 준비되면 org(또는 레포) 설정에서
  #   Variables: DEPLOY_ENABLED = true
  #   Secrets:   DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_SSH_KEY(개인키), DEPLOY_KNOWN_HOSTS
  # 를 넣으면 그때부터 동작한다. 서버에는 ~/infra (infra 레포 클론)와 .env.dev/.env.prod 가 있어야 한다.
  server:
    name: server
    needs: image                       # 이미지가 GHCR에 올라간 다음에
    # 서버 준비가 끝나 DEPLOY_ENABLED를 켰을 때만, develop·main에서만 (손으로 다른 브랜치를 돌려도 배포 안 함)
    if: vars.DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # develop → 개발(mspace-dev), main → 시연(mspace-prod). 둘이 동시에 돌아도 서로 안 섞인다
    concurrency:
      group: server-${{ github.ref }}
      cancel-in-progress: false        # 배포 도중에 끊지 않는다
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts   # 처음 보는 서버면 접속을 거부한다 (가짜 서버 방지)

      - name: 서버에서 새 이미지로 교체
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o BatchMode=yes "$SSH_USER@$HOST" bash -s -- "$TARGET" <<'REMOTE'
          set -euo pipefail
          T="$1"
          cd ~/infra
          git pull --ff-only                                   # compose·nginx 설정도 최신으로
          C="docker compose -p mspace-$T --env-file .env.$T"
          $C pull mcp agent
          $C up -d --no-deps mcp agent                    # 다른 서비스(DB 등)는 건드리지 않는다
          sleep 20
          $C ps mcp agent
          for s in mcp agent; do                                # 켜진 채로 남아 있어야 성공
            [ "$($C ps -q --status running $s)" ] || { echo "$s 실행 안 됨"; $C logs --tail=50 $s; exit 1; }
          done
          echo "배포 성공 ($T)"
          REMOTE

spring:
  application:
    name: mspace-assistant-agent

server:
  port: ${SERVER_PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health

mspace:
  llm:
    # gemini(시연) | ollama(학교 도입)
    provider: ${LLM_PROVIDER:gemini}
    gemini:
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      # 키는 .env·GitHub Secrets에만. 비어 있으면 비서는 "준비되지 않았어요"로 답한다
      api-key: ${GEMINI_API_KEY:}
      timeout: 20s
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b}
      timeout: 60s
  agent:
    mcp-server-url: ${MCP_SERVER_URL:http://localhost:8090}
    forward-headers:
      - Authorization
      - X-User-Id
    # 대화 한 번에 도구 호출 최대 횟수. 넘으면 멈추고 알린다 (CLAUDE.md 4장)
    max-tool-calls: 8
    timeout: 10s
    # 지시문에 넣는 예약 규칙. core 설정(mspace.reservation)과 같은 값으로 둔다
    rules:
      slot-minutes: 30
      max-hours: 2
      advance-days: 7

logging:
  level:
    # 요청·응답 본문(참여자 학번, 입실 번호, 학생 말)이 DEBUG 로그에 찍히지 않게 고정한다.
    # root를 DEBUG로 올려도 이 패키지들은 INFO/WARN에 머문다 (CLAUDE.md 4장)
    org.springframework.web: INFO
    org.springframework.http: INFO
    io.modelcontextprotocol: WARN

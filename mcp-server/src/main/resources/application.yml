spring:
  application:
    name: mspace-assistant-mcp
  ai:
    mcp:
      server:
        name: mspace-assistant
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE          # POST /mcp 하나로 주고받는다 (SSE 방식은 2.0에서 권장하지 않음)
        instructions: "조선대 IT융합대학 M-SPACE 학습공간 예약 도구. 시각은 서울 시간(+09:00)."

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health

mspace:
  core:
    base-url: ${CORE_BASE_URL:http://localhost:8080}
    # 학생 본인 토큰만 넘긴다. X-User-Id(로그인 붙기 전 임시)는 local 프로필에서만 켠다 (application-local.yml)
    forward-headers:
      - Authorization
    timeout: 3s
  # 쓰기 도구 확인 토큰. 짧게 두어 오래된 확인안이 실행되지 않게 한다
  confirm:
    ttl: 2m

logging:
  level:
    # MCP 요청 본문(사용자 말이 들어 있을 수 있음)을 로그에 남기지 않게 SDK 로그는 경고 이상만
    io.modelcontextprotocol: WARN
    # 확인 API 본문(참여자 학번)·core 응답(입실 번호)이 DEBUG 로그에 찍히지 않게 고정 (CLAUDE.md 4장)
    org.springframework.web: INFO
    org.springframework.http: INFO

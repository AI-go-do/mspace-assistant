spring:
  application:
    name: mspace-assistant-mcp
  data:
    redis:
      # SCHEDULE_STORE=redis일 때만 쓴다. compose에서는 agent와 같은 redis://redis:6379
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 2s
      timeout: 2s
  ai:
    mcp:
      server:
        name: mspace-assistant
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE          # POST /mcp 하나로 주고받는다 (SSE 방식은 2.0에서 권장하지 않음)
        instructions: "조선대 IT융합대학 M-SPACE 학습공간 예약 도구. 시각은 서울 시간(+09:00)."

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      # memory 모드에서는 Redis가 없으니 health에 넣지 않는다
      enabled: false

mspace:
  core:
    base-url: ${CORE_BASE_URL:http://localhost:8080}
    # 학생 본인 토큰만 넘긴다. X-User-Id(로그인 붙기 전 임시)는 local 프로필에서만 켠다 (application-local.yml)
    forward-headers:
      - Authorization
    timeout: 3s
    # core가 다른 서버에 있어 공용 구간을 지나면 true (#44). 같은 호스트의 compose(http://core:8080)·localhost는 false로 둔다
    require-https: ${CORE_REQUIRE_HTTPS:false}
  # 쓰기 도구 확인 토큰. 짧게 두어 오래된 확인안이 실행되지 않게 한다
  confirm:
    ttl: 2m
  # 연장하기(FR-RSV-105). core 규칙과 같은 값. core가 최종 판정하고 여기서는 확인안 전에 먼저 거른다
  continue:
    open-before-minutes: 10
    max-minutes: 120
    slot-minutes: 30

  # 학생이 직접 넣은 수업 시간표 (#63, 설계 5장). my_schedule 도구가 읽는다
  schedule:
    # memory: mcp-server 1대 메모리(재시작하면 사라짐) | redis: 위 spring.data.redis.url (키 agent:schedule:<학생 키>, TTL 없음)
    store: ${SCHEDULE_STORE:memory}
    # 마지막 수업이 끝나고 방까지 옮겨 갈 여유. searchFromAt = 끝 + 여유를 다음 30분 칸으로 올림 (14:50 → 15:30)
    buffer-minutes: 30
    slot-minutes: 30
    max-classes: 40
    max-name-chars: 30
    # week_plan: 오늘부터 며칠을, 수업 없는 날은 몇 시부터 볼지
    plan-days: 7
    plan-from-time: "09:00"

  # 학교 생활 도구 (11차 회의 11/13, 재웅 제안: 아침 브리핑). 예약 코어는 부르지 않는다
  campus:
    weather:
      # Open-Meteo: 키 없음. 학교 좌표만 보낸다(학생 정보 없음). 끄면 campus_weather가 "볼 수 없어요"로 답한다
      enabled: ${CAMPUS_WEATHER_ENABLED:true}
      base-url: ${CAMPUS_WEATHER_URL:https://api.open-meteo.com}
      latitude: 35.1408       # 조선대 (확인 필요)
      longitude: 126.9300
      place: 광주 조선대
      timeout: 3s
      umbrella-percent: 50    # 비 올 확률이 이 값 이상이면 우산
      cache: 10m              # 같은 예보를 다시 쓰는 시간
    shuttle:
      # 출처: 조선대 교내버스 안내 https://www3.chosun.ac.kr/chosun/160/subview.do (11/13 읽음). 공지에 있는 값만 넣었다.
      # - 공지에 운행 요일은 없고 "공휴일 운행하지 않음"만 있다 → 요일은 기본(월~금)으로 두고 basis에 공휴일을 밝힌다 (주말 운행은 확인 필요)
      # - 간격 운행("15분 간격")은 시작 시각부터 그 간격으로 펼친 시각이라 실제와 몇 분 다를 수 있다 → basis에 밝힌다
      # - 시내버스(419·57·61·87번, 해오름관 06:00~22:20)는 배차 간격이 공지에 없어 넣지 않았다
      basis: 학교 교내버스 안내의 시간표 기준이에요. 실시간 위치가 아니라 몇 분 다를 수 있고(간격 운행은 그 간격으로 계산한 시각), 공휴일에는 운행하지 않아요.
      season: SEMESTER   # 방학이 되면 VACATION으로 바꾼다 (본관 버스 시간표가 바뀌고 글로벌하우스 버스는 멈춤)
      routes:
        - name: 본관 순환 버스
          stop: 설립기념탑 → 미대 → 중앙도서관 → 공대 제2공학관 → 법대·경상대 → 본관 북쪽 → 학생회관 → 설립기념탑
          season: SEMESTER
          windows:
          - {from: "07:40", to: "17:00", note: "수시 운행(5~10분 간격)"}
          - {from: "17:00", to: "18:45", every: 15m}
          - {from: "18:45", to: "20:00", note: "저녁 시간, 20:00에 다시 출발"}
          - {from: "20:00", to: "23:00", every: 20m}
        - name: 본관 순환 버스
          stop: 설립기념탑 → 미대 → 중앙도서관 → 공대 제2공학관 → 법대·경상대 → 본관 북쪽 → 학생회관 → 설립기념탑
          season: VACATION
          departures: ["09:45", "10:45", "11:45", "12:45", "13:45", "14:45", "15:45", "16:45"]   # 09:00~17:00 매시 45분
          windows:
          - {from: "08:20", to: "09:00", every: 10m}
        - name: 사회과학관 버스
          stop: 설립기념탑 → 미대 → 사회과학관 → 설립기념탑
          windows:
          - {from: "07:40", to: "08:10", note: "본관 버스 이용"}
          - {from: "08:20", to: "10:00", every: 10m}
          - {from: "10:30", to: "11:10", every: 10m}
          - {from: "12:30", to: "13:00", every: 10m}
          - {from: "13:30", to: "14:00", every: 10m}
          - {from: "14:30", to: "15:00", every: 10m}
          - {from: "15:30", to: "16:00", every: 10m}
          - {from: "16:30", to: "17:00", every: 10m}
          - {from: "17:00", to: "23:00", note: "본관 야간 버스 이용"}
        - name: 글로벌하우스 버스
          stop: 글로벌하우스 → 해오름관 → 국제관 → 설립기념탑 → 해오름관 → 항공우주·선박해양공학관 → 글로벌하우스
          season: SEMESTER   # 야간·방학 중·공휴일 운행 안 함
          windows:
          - {from: "08:20", to: "09:00", note: "본관 버스 이용"}
          - {from: "09:20", to: "10:00", every: 20m}
          - {from: "10:20", to: "11:20", every: 20m}
          - {from: "12:40", to: "13:40", every: 10m}
          - {from: "14:00", to: "14:40", every: 20m}
          - {from: "15:00", to: "15:40", every: 20m}
          - {from: "16:20", to: "16:40", every: 20m}
          - {from: "17:00", to: "17:40", every: 10m}
          - {from: "18:00", to: "18:30", every: 10m}
    city-bus:
      # IT융합대학 앞 시내버스 도착 (영준 11/13: 정류장 번호 1177). 공공데이터포털 "전남광주통합특별시_광주버스정보"
      # https://www.data.go.kr/data/15157923/openapi.do (무료). 키가 비면 city_bus_arrival이 "아직 연결 전"으로 답한다
      # 키는 .env의 GWANGJU_BUS_KEY에만 넣는다(커밋 금지). 포털의 "일반 인증키(Decoding)" 값을 쓴다
      service-key: ${GWANGJU_BUS_KEY:}
      base-url: https://apis.data.go.kr/6290000/gj_bis
      arrive-path: /arriveInfo     # 경로·필드 이름은 키를 받은 뒤 실제 응답으로 확인 필요
      station-path: /stationInfo
      ars-id: "1177"               # 표지판 번호. API의 정류소 ID(BUSSTOP_ID)와 다른 체계라 비워 두면 처음 한 번 찾는다
      busstop-id: ${GWANGJU_BUS_STOP_ID:}
      stop-name: IT융합대학
      timeout: 3s
      cache: 30s                   # 같은 도착 정보를 30초 동안 다시 쓴다 (학생이 많아도 호출이 30초에 1번)

logging:
  level:
    # MCP 요청 본문(사용자 말이 들어 있을 수 있음)을 로그에 남기지 않게 SDK 로그는 경고 이상만
    io.modelcontextprotocol: WARN
    # 확인 API 본문(참여자 학번)·core 응답(입실 번호)이 DEBUG 로그에 찍히지 않게 고정 (CLAUDE.md 4장)
    org.springframework.web: INFO
    org.springframework.http: INFO
